name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests (medical logic)
        run: ./gradlew -p core test --no-daemon
      - name: App unit tests (Robolectric)
        run: ./gradlew :app:testDebugUnitTest --no-daemon
      - name: APK triage regression tests
        run: python3 -I -m unittest discover -s tools/linx-re/tests
      - name: Build APK
        run: ./gradlew :app:assembleRelease --no-daemon
      - name: Android lint
        run: ./gradlew :app:lintDebug --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            core/build/test-results/test/*.xml
            app/build/test-results/testDebugUnitTest/*.xml
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: SmartCGM-apk
          path: app/build/outputs/apk/release/*.apk

  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Worker tests (family sync backend)
        run: npm test
        working-directory: backend
